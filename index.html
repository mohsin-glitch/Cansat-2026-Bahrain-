<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKYLINK | CanSat 2026 Weekly Blog</title>
  <meta name="description" content="Official weekly engineering blog for Team Skylink (CanSat 2026).">
  <!-- Clean Space Grotesk & Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Space Glow -->
  <div class="stars-bg"></div>
  <div class="glow-orb"></div>

  <div class="app-wrapper">
    
    <!-- Profile & Header -->
    <header class="header">
      <div class="badge">
        <span class="live-dot"></span>
        <span>CANSAT 2026 • OFFICIAL LOG</span>
      </div>

      <div class="logo-box">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3v6"/>
          <path d="M12 15v6"/>
          <path d="M3 12h6"/>
          <path d="M15 12h6"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
        </svg>
      </div>

      <h1 class="team-title">SKYLINK</h1>
      <p class="team-subtitle">Weekly Flight & Engineering Blog</p>
      <p class="timeline-date">October 25 – December 12, 2026</p>
    </header>

    <!-- The 7 Week Buttons -->
    <main class="weeks-container" id="weeksList">
      <!-- 7 Buttons rendered by app.js -->
    </main>

    <!-- Simple Footer -->
    <footer class="footer">
      <div class="footer-links">
        <a href="https://instagram.com" target="_blank" rel="noopener" class="footer-btn">
          Instagram ↗
        </a>
        <a href="admin.html" class="footer-btn admin">
          ⚙️ Admin Edit
        </a>
      </div>
      <p class="footer-copy">Team Skylink • CanSat 2026</p>
    </footer>

  </div>

  <!-- Weekly Log Modal -->
  <div class="modal-overlay" id="readModal">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <span class="modal-week-tag" id="modalTag">WEEK 01</span>
          <h2 class="modal-heading" id="modalHeading">Title</h2>
          <span class="modal-subdate" id="modalDates">Dates</span>
        </div>
        <button class="modal-close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-content-text" id="modalContent">
        <!-- Text rendered by JS -->
      </div>
    </div>
  </div>

  <script src="posts.js"></script>
  <script src="app.js"></script>
</body>
</html>
